name: Build and Push Docker Images

on:
  push:
    branches:
      - master
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  # master への push ごとにリリースする。タグは v + Dockerfile の NGINX_VERSION で、そのタグが既にあれば
  # -1, -2 … を付ける(nginx を上げずに依存やベースだけを作り直したイメージも、新しいタグで取り込めるように)
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          base="v$(sed -n 's/^ENV NGINX_VERSION *//p' Dockerfile)"
          tags="$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##')"
          if ! grep -qxF "$base" <<<"$tags"; then
            tag="$base"
          else
            n="$(grep -oP "^\Q$base\E-\K[0-9]+$" <<<"$tags" | sort -n | tail -1)"
            tag="$base-$(( ${n:-0} + 1 ))"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN で作ったリリースは release イベントのワークフローを起動しないので、
  # push でリリースするときもこのジョブを同じ実行の中で走らせる
  build-multiarch:
    needs: version
    if: ${{ !cancelled() && (github.event_name == 'release' || needs.version.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'release' && github.ref_name || needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/https-portal:latest,ghcr.io/${{ github.repository_owner }}/https-portal:${{ env.TAG }}

  # イメージを push できてからリリースを作る。ノートは、nginx を上げたリリースなら NGINX_VERSION の行を
  # 最後に変えたコミットの PR 本文、-N のリリースならこの push のコミットの PR 本文
  release:
    needs: [version, build-multiarch]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        run: |
          if [[ $TAG =~ -[0-9]+$ ]]; then
            src="$GITHUB_SHA"
          else
            src="$(git log -1 --format=%H -G '^ENV NGINX_VERSION' -- Dockerfile)"
          fi
          body="$(gh api "repos/$GITHUB_REPOSITORY/commits/$src/pulls" --jq '.[0].body // ""')"
          if [ -n "$body" ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "$body"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

  # イメージを push できたら alvaldi のスタックを入れ替える。鍵は Actions secret DEPLOY_SSH_KEY で、
  # ホスト側の authorized_keys で入れ替えスクリプト (latest を pull してスタックごと作り直す) しか実行できない。
  # 接続先とホスト鍵は DEPLOY_TARGET (user@host) / DEPLOY_KNOWN_HOSTS
  deploy:
    needs: build-multiarch
    if: ${{ !cancelled() && needs.build-multiarch.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-alvaldi
      cancel-in-progress: false
    steps:
      - name: コンテナの入れ替え
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          chmod 600 "$dir/key"
          # 実行されるコマンドはホスト側の authorized_keys の command= で決まる
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o StrictHostKeyChecking=yes \
            "$DEPLOY_TARGET"
